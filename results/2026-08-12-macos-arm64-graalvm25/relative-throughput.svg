<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="543" viewBox="0 0 1200 543" role="img" aria-labelledby="title desc">
<title id="title">Fory JSON throughput relative to Jackson</title>
<desc id="desc">Ratio of median Fory JSON operations per second to median Jackson operations per second.</desc>
<rect width="1200" height="543" fill="#ffffff"/>
<text x="48.0" y="52.0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Fory JSON throughput relative to Jackson</text>
<text x="48.0" y="84.0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#667085">Ratio of medians; 1.0× means equal throughput</text>
<line x1="245.0" y1="121" x2="245.0" y2="443.0" stroke="#d9dee8" stroke-width="1"/>
<text x="245.0" y="473.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">0×</text>
<line x1="452.5" y1="121" x2="452.5" y2="443.0" stroke="#d9dee8" stroke-width="1"/>
<text x="452.5" y="473.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">1×</text>
<line x1="660.0" y1="121" x2="660.0" y2="443.0" stroke="#d9dee8" stroke-width="1"/>
<text x="660.0" y="473.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">2×</text>
<line x1="867.5" y1="121" x2="867.5" y2="443.0" stroke="#d9dee8" stroke-width="1"/>
<text x="867.5" y="473.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">3×</text>
<line x1="1075.0" y1="121" x2="1075.0" y2="443.0" stroke="#d9dee8" stroke-width="1"/>
<text x="1075.0" y="473.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">4×</text>
<line x1="452.5" y1="121" x2="452.5" y2="443.0" stroke="#172033" stroke-width="2" stroke-dasharray="7 6"/>
<text x="459.5" y="114.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#667085">equal</text>
<text x="223.0" y="158.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">String serialize</text>
<rect x="245" y="135.0" width="420.3" height="35" rx="3" fill="#f97316"/>
<text x="675.3" y="158.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">2.03×</text>
<text x="223.0" y="240.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">String deserialize</text>
<rect x="245" y="217.0" width="308.4" height="35" rx="3" fill="#f97316"/>
<text x="563.4" y="240.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">1.49×</text>
<text x="223.0" y="322.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">UTF-8 serialize</text>
<rect x="245" y="299.0" width="612.7" height="35" rx="3" fill="#f97316"/>
<text x="867.7" y="322.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">2.95×</text>
<text x="223.0" y="404.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">UTF-8 deserialize</text>
<rect x="245" y="381.0" width="435.3" height="35" rx="3" fill="#f97316"/>
<text x="690.3" y="404.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">2.10×</text>
</svg>
