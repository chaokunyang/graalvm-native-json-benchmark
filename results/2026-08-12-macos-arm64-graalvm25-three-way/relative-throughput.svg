<line x1="488.8" y1="170.0" x2="493.5" y2="170.0" stroke="#172033" stroke-width="2"/>
<line x1="488.8" y1="164.0" x2="488.8" y2="176.0" stroke="#172033" stroke-width="2"/>
<line x1="493.5" y1="164.0" x2="493.5" y2="176.0" stroke="#172033" stroke-width="2"/>
