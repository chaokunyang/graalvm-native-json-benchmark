<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="675" viewBox="0 0 1300 675" role="img" aria-labelledby="title desc">
<title id="title">Fory JSON throughput relative to both Jackson configurations</title>
<desc id="desc">Ratios of median Fory JSON operations per second to the Jackson configurations. Whiskers show paired min–max ratios.</desc>
<defs>
<pattern id="ordinary-ratio-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#f97316"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-opacity="0.42" stroke-width="3"/>
</pattern>
</defs>
<rect width="1300" height="675" fill="#ffffff"/>
<text x="48.0" y="52.0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#172033">Fory JSON throughput relative to both Jackson configurations</text>
<text x="48.0" y="84.0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#667085">Bars show ratios of medians; whiskers show paired min–max; 1.0× means equal throughput</text>
<rect x="650" y="103" width="24" height="16" rx="2" fill="#f97316"/>
<text x="684.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#172033">vs. Jackson (build-time generated)</text>
<rect x="955" y="103" width="24" height="16" rx="2" fill="url(#ordinary-ratio-pattern)"/>
<text x="989.0" y="117.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#172033">vs. Jackson (ordinary Databind)</text>
<line x1="270.0" y1="141" x2="270.0" y2="579.0" stroke="#d9dee8" stroke-width="1"/>
<text x="270.0" y="609.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">0×</text>
<line x1="491.2" y1="141" x2="491.2" y2="579.0" stroke="#d9dee8" stroke-width="1"/>
<text x="491.2" y="609.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">2×</text>
<line x1="712.5" y1="141" x2="712.5" y2="579.0" stroke="#d9dee8" stroke-width="1"/>
<text x="712.5" y="609.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">4×</text>
<line x1="933.8" y1="141" x2="933.8" y2="579.0" stroke="#d9dee8" stroke-width="1"/>
<text x="933.8" y="609.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">6×</text>
<line x1="1155.0" y1="141" x2="1155.0" y2="579.0" stroke="#d9dee8" stroke-width="1"/>
<text x="1155.0" y="609.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#667085">8×</text>
<line x1="380.6" y1="141" x2="380.6" y2="579.0" stroke="#172033" stroke-width="2" stroke-dasharray="7 6"/>
<text x="387.6" y="134.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#667085">equal</text>
<text x="248.0" y="196.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">String serialize</text>
