<line x1="908.0" y1="500.0" x2="931.0" y2="500.0" stroke="#172033" stroke-width="2"/>
<line x1="908.0" y1="494.0" x2="908.0" y2="506.0" stroke="#172033" stroke-width="2"/>
<line x1="931.0" y1="494.0" x2="931.0" y2="506.0" stroke="#172033" stroke-width="2"/>
<text x="931.5" y="506.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">5.89×</text>
<rect x="270" y="526.0" width="229.4" height="30" rx="3" fill="url(#ordinary-ratio-pattern)"/>
<line x1="497.1" y1="541.0" x2="499.9" y2="541.0" stroke="#172033" stroke-width="2"/>
<line x1="497.1" y1="535.0" x2="497.1" y2="547.0" stroke="#172033" stroke-width="2"/>
