<line x1="433.6" y1="321.0" x2="435.8" y2="321.0" stroke="#172033" stroke-width="2"/>
<line x1="433.6" y1="315.0" x2="433.6" y2="327.0" stroke="#172033" stroke-width="2"/>
<line x1="435.8" y1="315.0" x2="435.8" y2="327.0" stroke="#172033" stroke-width="2"/>
<text x="445.0" y="327.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">1.49×</text>
<text x="248.0" y="416.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">UTF-8 serialize</text>
