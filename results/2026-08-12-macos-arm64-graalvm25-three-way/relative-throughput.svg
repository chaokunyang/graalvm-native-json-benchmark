<rect x="270" y="416.0" width="323.4" height="30" rx="3" fill="url(#ordinary-ratio-pattern)"/>
<line x1="586.9" y1="431.0" x2="596.3" y2="431.0" stroke="#172033" stroke-width="2"/>
<line x1="586.9" y1="425.0" x2="586.9" y2="437.0" stroke="#172033" stroke-width="2"/>
<line x1="596.3" y1="425.0" x2="596.3" y2="437.0" stroke="#172033" stroke-width="2"/>
<text x="603.4" y="437.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#172033">2.92×</text>
<text x="248.0" y="526.5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" fill="#172033">UTF-8 deserialize</text>
